name: Benchmark

# Trains and evaluates all models (downloads EuroSAT + ImageNet weights) and commits the results.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/benchmark.yml", "src/visionkit/experiment.py", "src/visionkit/models.py"]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt && pip install -e .
      - name: Run benchmark
        run: |
          mkdir -p reports
          set -o pipefail
          python -u -m visionkit.experiment 2>&1 | tee reports/run_log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Benchmark results [skip ci]"
          git pull --rebase origin main
          git push
